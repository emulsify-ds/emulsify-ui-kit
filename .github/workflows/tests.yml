name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        # Check whether components were changed.
        # Then below, we can only run steps if there's something to test.
      - uses: dorny/paths-filter@v4.0.3
        id: component_changes
        with:
          filters: |
            components:
              - 'src/**'
              - 'assets/**'
              - 'config/**'
              - 'package*.json'
              - '.nvmrc'
              - '.github/workflows/tests.yml'
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Build storybook
        if: steps.component_changes.outputs.components == 'true'
        run: npm run storybook-build
      - name: Run Percy Tests
        if: steps.component_changes.outputs.components == 'true'
        run: |
          if [ -z "$PERCY_TOKEN" ]; then
            echo "::notice::PERCY_TOKEN is unavailable. Checking Storybook snapshot discovery only."
            npm run visreg-ci -- --dry-run
          else
            npm run visreg-ci
          fi
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
  cli-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install CLI
        run: npm install -g @emulsify/cli@2.4.1
      - name: Install starter
        run: emulsify init "Emulsify Drupal Starter" . --platform drupal --yes
      - name: Install system and all components
        run: |
          git branch emulsify-ci-system "$GITHUB_SHA"
          cd emulsify_drupal_starter
          emulsify system install --repository "$GITHUB_WORKSPACE" --checkout emulsify-ci-system --all --yes
