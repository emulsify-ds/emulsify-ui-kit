$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Text
description: Renders a complete formatted text field inside a themed section.
group: Components
status: stable
props:
  type: object
  properties:
    text__content:
      type: [string, object, 'null']
      title: Formatted text
      description: Processed text markup or a rendered Drupal text field.
      examples:
        - |
          <h2>Plan your visit</h2>
          <p>Check the <a href="#visiting-hours">visiting hours</a> before you leave.</p>
          <ul><li>Bring your ticket.</li><li>Allow time to get settled.</li></ul>
          <hr>
          <h3 id="visiting-hours">Visiting hours</h3>
          <p>Arrive any time during the <strong>open house</strong>.</p>
    text__heading:
      type: [string, object, 'null']
      title: Introduction heading
      description: Optional heading for the section introduction.
      default: null
    text__heading_level:
      type: [integer, 'null']
      title: Introduction heading level
      description: Semantic rank for the optional introduction heading.
      enum: [2, 3, 4, 5, 6, null]
      default: 2
    text__width:
      type: [string, 'null']
      title: Width
      description: Maximum width of the section.
      enum: [narrow, content, wide, full, null]
      default: narrow
    text__alignment:
      type: [string, 'null']
      title: Alignment
      description: Alignment of the container within the available space.
      enum: [left, center, right, null]
      default: center
    text__theme:
      type: [string, 'null']
      title: Theme
      description: Optional container theme. Inherits its surroundings when omitted.
      examples: [default]
    text__theme__variation:
      type: [string, 'null']
      title: Theme variation
      description: Optional light or dark container theme variation.
      enum: [light, dark, null]
    text__bg_color:
      type: [boolean, 'null']
      title: Themed background
      description: Paint the container background using the active theme.
      default: false
    text__spacing:
      type: [string, 'null']
      title: Section spacing
      description: Container spacing around the formatted text.
      enum:
        [
          none,
          quarter,
          half,
          one,
          two,
          three,
          four,
          none-top,
          none-bottom,
          quarter-top,
          quarter-bottom,
          half-top,
          half-bottom,
          one-top,
          one-bottom,
          two-top,
          two-bottom,
          three-top,
          three-bottom,
          four-top,
          four-bottom,
          null,
        ]
      default: one
    text__id:
      type: [string, 'null']
      title: Section ID
      description: Optional stable suffix for the container's section ID.
      examples: [visiting-information]
    text__container__modifiers:
      type: [array, 'null']
      title: Container modifiers
      description: BEM modifiers for the containing section.
      items:
        type: string
    text__blockname:
      type: [string, 'null']
      title: Parent block
      description: Optional parent BEM block for the formatted text wrapper.
    text__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: BEM modifiers for the formatted text wrapper.
      items:
        type: string
    text__additional_classes:
      type: [array, 'null']
      title: Additional classes
      description: Extra classes for the formatted text wrapper.
      items:
        type: string
    text__attributes:
      type: [object, 'null']
      title: Attributes
      description: Additional attributes for the formatted text wrapper.
slots:
  text__formatted_content:
    title: Formatted content
    description: Replaces the formatted text prop with rendered content.
