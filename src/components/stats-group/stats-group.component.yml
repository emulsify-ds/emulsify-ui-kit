$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Stats Group
description: A responsive group of statistics with a label for each metric.
group: Components
status: stable
props:
  type: object
  properties:
    stats_group__heading:
      type: [string, 'null']
      title: Heading
      description: Optional title above the statistics.
      examples: ['The library in numbers']
    stats_group__heading_level:
      type: [integer, 'null']
      title: Heading level
      description: Semantic level of the group heading.
      enum: [2, 3, 4, 5, 6, null]
      default: 2
    stats_group__content:
      type: [string, object, array, 'null']
      title: Introduction
      description: Supporting text or processed content shown above the statistics.
      examples: ['Here is what our community made possible this year.']
    stats_group__items:
      type: [array, 'null']
      title: Statistics
      description: Metrics with concise labels that explain what each number measures.
      default: []
      items:
        type: object
        properties:
          metric:
            type: [string, number]
            title: Metric
            description: The value to display, including its unit if needed.
          description:
            type: string
            title: Label
            description: Short plain-text label for the value.
        required: [metric, description]
      examples:
        - - metric: '1,240'
            description: Workshop participants
          - metric: 36
            description: Community events
          - metric: '92%'
            description: Participant satisfaction
    stats_group__grid_columns:
      type: [integer, 'null']
      title: Columns
      description: Maximum number of columns in the responsive grid.
      enum: [1, 2, 3, 4, 5, 6, null]
      default: 3
    stats_group__animate:
      type: [boolean, 'null']
      title: Animate
      description: Apply a short entrance motion when reduced motion is off.
      default: false
    stats_group__width:
      type: [string, 'null']
      title: Width
      description: Maximum width of the layout container.
      enum: [narrow, content, wide, full, null]
      default: narrow
    stats_group__alignment:
      type: [string, 'null']
      title: Alignment
      description: Placement of the layout container.
      enum: [left, center, right, null]
      default: left
    stats_group__theme:
      type: [string, 'null']
      title: Theme
      description: Section theme name. Omit to inherit.
      enum: [default, null]
    stats_group__theme__variation:
      type: [string, 'null']
      title: Theme variation
      description: Section theme variation. Omit to inherit.
      enum: [light, dark, null]
    stats_group__bg_color:
      type: [boolean, 'null']
      title: Background
      description: Paint the section with the active theme background.
      default: false
    stats_group__spacing:
      type: [string, 'null']
      title: Spacing
      description: Vertical space around the section, using the container spacing scale.
      default: two
    stats_group__id:
      type: [string, 'null']
      title: Section ID
      description: Stable suffix for the section anchor.
      default: null
    stats_group__container__modifiers:
      type: [array, 'null']
      title: Container modifiers
      description: BEM modifiers for the layout container.
      items:
        type: string
      default: []
    stats_group__blockname:
      type: [string, 'null']
      title: Parent block
      description: Optional parent BEM block name.
    stats_group__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: BEM modifiers for the statistics wrapper.
      items:
        type: string
    stats_group__additional_classes:
      type: [array, 'null']
      title: Classes
      description: Additional classes for the statistics wrapper.
      items:
        type: string
    stats_group__attributes:
      type: [object, 'null']
      title: Attributes
      description: Attributes for the statistics wrapper.
slots:
  stats_group__items_content:
    title: Statistics content
    description: Replace the generated items with complete statistic groups.
