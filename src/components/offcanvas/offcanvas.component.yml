$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Offcanvas
group: Components
status: stable
description: A dismissible native dialog displayed as an edge pane or centered modal.
libraryOverrides:
  dependencies: [core/drupal, core/once]
props:
  type: object
  required: [offcanvas__heading]
  properties:
    offcanvas__heading:
      type: string
      title: Heading
      description: Dialog heading and accessible name.
      minLength: 1
      examples: ['Workshop details']
    offcanvas__id:
      type: [string, 'null']
      title: ID
      description: Set a stable unique ID for each instance with a repeated heading.
      pattern: '^\S+$'
      default: null
    offcanvas__heading_level:
      type: [integer, 'null']
      title: Heading level
      description: Heading level in the surrounding page structure.
      enum: [2, 3, 4, 5, 6, null]
      default: 2
    offcanvas__show_heading:
      type: [boolean, 'null']
      title: Show heading
      description: Show the heading visually. The heading always names the dialog.
      default: true
    offcanvas__type:
      type: [string, 'null']
      title: Type
      description: Display the dialog as a pane or modal.
      enum: [pane, modal, null]
      default: pane
    offcanvas__direction:
      type: [string, 'null']
      title: Pane direction
      description: Viewport edge where the pane opens.
      enum: [top, right, bottom, left, null]
      default: right
    offcanvas__theme:
      type: [string, 'null']
      title: Theme
      description: Optionally override the inherited theme. The light and dark values select the corresponding default variation.
      enum: [default, light, dark, null]
      default: null
    offcanvas__theme__variation:
      type: [string, 'null']
      title: Theme variation
      description: Color variation for the dialog and trigger.
      enum: [light, dark, null]
      default: null
    offcanvas__trigger__text:
      type: [string, 'null']
      title: Trigger label
      description: Label of the trigger button. Defaults to the heading.
      examples: ['View workshop details']
    offcanvas__content:
      type: [string, array, object, 'null']
      title: Body
      description: Default text or renderable content in the dialog body.
      examples:
        - '<p>The workshop starts at 10 a.m. Bring a notebook.</p><p><a href="/workshops">Browse other workshops</a></p>'
    offcanvas__suffix:
      type: [string, array, object, 'null']
      title: Footer
      description: Optional text or renderable content after the dialog body.
      default: null
    offcanvas__blockname:
      type: [string, 'null']
      title: Block name
      description: Parent block name for the wrapper class.
    offcanvas__modifiers:
      type: [array, 'null']
      title: Class modifiers
      description: Additional BEM modifier suffixes.
      items:
        type: string
    offcanvas__additional_classes:
      type: [array, 'null']
      title: Additional classes
      description: Additional classes on the wrapper.
      items:
        type: string
    offcanvas__attributes:
      type: [object, 'null']
      title: Attributes
      description: HTML attributes applied to the wrapper.
slots:
  offcanvas__trigger_content:
    title: Trigger content
    description: Inline content that names the CTA trigger.
  offcanvas__body_content:
    title: Body content
    description: Content that replaces the default dialog body.
  offcanvas__footer_content:
    title: Footer content
    description: Content that replaces the default dialog footer.
