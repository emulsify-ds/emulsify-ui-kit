$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Page Title
description: The page heading with optional breadcrumbs, supporting content, actions, and media.
group: Components
status: stable
props:
  type: object
  required: [page_title__heading]
  properties:
    page_title__heading:
      type: string
      title: Heading
      description: The primary heading for the page. Rendered as an h1.
      minLength: 1
      examples: ['Explore the film collection']
    page_title__overline:
      type: [string, 'null']
      title: Overline
      description: A short category or context label above the heading.
      default: null
    page_title__overline__url:
      type: [string, 'null']
      title: Overline URL
      description: Optional destination for the overline label.
      format: uri-reference
      default: null
    page_title__subheading:
      type: [string, 'null']
      title: Subheading
      description: Short supporting text beneath the page heading.
      default: null
    page_title__ctas:
      type: [array, 'null']
      title: Calls to action
      description: Up to two links to the main tasks on the page.
      default: []
      maxItems: 2
      items:
        type: object
        required: [content, url]
        additionalProperties: false
        properties:
          content:
            type: string
          url:
            type: string
            format: uri-reference
          icon:
            type: string
          icon_position:
            type: string
            enum: [left, right]
    page_title__layout:
      type: [string, 'null']
      title: Media layout
      description: Position the media beside the heading on wide layouts or stack it below.
      enum: [inline, stacked, null]
      default: inline
    page_title__media_alignment:
      type: [string, 'null']
      title: Media placement
      description: Place the media to the left or right of the copy in the inline layout.
      enum: [left, right, null]
      default: right
    page_title__width:
      type: [string, 'null']
      title: Container width
      description: Width of the page title container.
      enum: [narrow, content, wide, full, null]
      default: wide
    page_title__alignment:
      type: [string, 'null']
      title: Container alignment
      description: Alignment of the container's inner wrapper.
      enum: [left, center, right, null]
      default: center
    page_title__theme:
      type: [string, 'null']
      title: Theme
      description: Container theme name. Inherits the surrounding theme when omitted.
      default: null
    page_title__theme__variation:
      type: [string, 'null']
      title: Theme variation
      description: Light or dark color roles.
      enum: [light, dark, null]
      default: null
    page_title__bg_color:
      type: [boolean, 'null']
      title: Background color
      description: Paint the section with the active theme's background color.
      default: false
    page_title__spacing:
      type: [string, 'null']
      title: Container spacing
      description: Container spacing preset for the page title.
      default: two
    page_title__id:
      type: [string, 'null']
      title: Section ID
      description: Stable anchor suffix for the surrounding container.
      default: null
    page_title__container__modifiers:
      type: [array, 'null']
      title: Container modifiers
      description: BEM modifiers applied to the container.
      default: []
      items:
        type: string
    page_title__blockname:
      type: [string, 'null']
      title: Parent block
      description: Parent block used for the Page Title BEM class.
    page_title__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: Optional BEM modifiers for the Page Title wrapper.
      items:
        type: string
    page_title__additional_classes:
      type: [array, 'null']
      title: Additional classes
      description: Additional classes for the Page Title wrapper.
      items:
        type: string
    page_title__attributes:
      type: [object, 'null']
      title: Attributes
      description: Additional HTML attributes for the Page Title wrapper.
slots:
  page_title__breadcrumbs_content:
    title: Breadcrumbs
    description: An optional navigation trail before the heading.
  page_title__description_content:
    title: Description
    description: Optional formatted text below the subheading.
  page_title__media_content:
    title: Media
    description: Optional composed image or video. Supply an alternative for meaningful media.
