$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Embed
description: A responsive iframe or composed widget with optional introduction and caption.
group: Components
status: stable
props:
  type: object
  properties:
    embed__src:
      type: [string, 'null']
      title: Iframe URL
      description: A web URL for a generated iframe. Supply a descriptive title alongside it.
      examples: ['https://www.youtube-nocookie.com/embed/M7lc1UVf-VE']
    embed__title:
      type: [string, 'null']
      title: Iframe title
      description: Required accessible title when generating an iframe from a URL.
      examples: ['Tour of the makerspace']
    embed__iframe:
      type: [string, 'null']
      title: Iframe markup
      description: Trusted or pre-sanitized widget markup. Every iframe needs a nonempty title.
      default: null
    embed__heading:
      type: [string, 'null']
      title: Heading
      description: Optional section heading displayed above the media.
      examples: ['Visit the makerspace']
    embed__heading_level:
      type: [integer, 'null']
      title: Heading level
      description: Semantic section heading level.
      enum: [2, 3, 4, 5, 6, null]
      default: 2
    embed__text:
      type: [string, object, array, 'null']
      title: Introduction
      description: Optional introductory copy or processed content.
      examples: ['Watch a short tour before your visit.']
    embed__caption:
      type: [string, 'null']
      title: Caption
      description: Optional visible description displayed below the media.
      examples: ['Recorded during the spring open house.']
    embed__ratio:
      type: [string, 'null']
      title: Aspect ratio
      description: Responsive aspect ratio preset.
      enum: ['16-9', '4-3', '1-1', custom, null]
      default: '16-9'
    embed__ratio_custom:
      type: [string, 'null']
      title: Custom aspect ratio
      description: Positive number or ratio used with the custom preset.
      examples: ['21 / 9']
    embed__width:
      type: [string, 'null']
      title: Width
      description: Maximum width of the layout container.
      enum: [narrow, content, wide, full, null]
      default: content
    embed__alignment:
      type: [string, 'null']
      title: Alignment
      description: Placement of the layout container.
      enum: [left, center, right, null]
      default: center
    embed__theme:
      type: [string, 'null']
      title: Theme
      description: Section theme name. Omit to inherit.
      enum: [default, null]
    embed__theme__variation:
      type: [string, 'null']
      title: Theme variation
      description: Section theme variation. Omit to inherit.
      enum: [light, dark, null]
    embed__bg_color:
      type: [boolean, 'null']
      title: Section background
      description: Paint the section with the active theme background.
      default: false
    embed__spacing:
      type: [string, 'null']
      title: Section spacing
      description: Vertical space around the section using the Container spacing scale.
      default: one
    embed__id:
      type: [string, 'null']
      title: Section ID
      description: Stable suffix for the section anchor.
      default: null
    embed__container__modifiers:
      type: [array, 'null']
      title: Container modifiers
      description: BEM modifiers for the layout container.
      items:
        type: string
      default: []
    embed__blockname:
      type: [string, 'null']
      title: Parent block
      description: Optional parent BEM block name.
    embed__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: BEM modifiers for the media wrapper.
      items:
        type: string
    embed__additional_classes:
      type: [array, 'null']
      title: Additional classes
      description: Additional classes for the media wrapper.
      items:
        type: string
    embed__attributes:
      type: [object, 'null']
      title: Attributes
      description: Attributes for the media wrapper.
    embed__media_modifiers:
      type: [array, 'null']
      title: Media modifiers
      description: Additional BEM modifiers for the responsive media box.
      default: []
      items:
        type: string
slots:
  embed__content:
    title: Embed content
    description: Trusted composed markup that takes precedence over the iframe props. Every iframe needs a nonempty title.
