$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tags
description: A short list of topic labels and links to related content.
group: Components
status: stable
libraryOverrides:
  dependencies: [core/drupal, core/once]
props:
  type: object
  properties:
    tags__items:
      type: [array, 'null']
      title: Tags
      description: Tags in reading order, with optional destinations and color accents.
      default: []
      examples:
        - - title: Community
          - title: Photography
            url: /topics/photography
            color: primary
          - title: Outdoors
            url: /topics/outdoors
            color: green
      items:
        type: object
        properties:
          title:
            type: string
            title: Label
            description: The visible tag name.
          url:
            type: [string, 'null']
            title: URL
            description: Destination for the tag link. Omit for a static label.
          color:
            type: [string, 'null']
            title: Color accent
            description: One of primary, dark, yellow, green, or a CSS color for a custom tint.
        required: [title]
    tags__blockname:
      type: [string, 'null']
      title: Parent block
      description: Optional parent BEM block name.
    tags__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: BEM modifiers for the list.
      items:
        type: string
    tags__additional_classes:
      type: [array, 'null']
      title: Classes
      description: Additional classes for the list.
      items:
        type: string
    tags__attributes:
      type: [object, 'null']
      title: Attributes
      description: Additional attributes for the list.
slots:
  tags__items_content:
    title: Composed list items
    description: Replace the generated items with list-item markup.
