$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Text with Image
description: Pairs a section heading and formatted copy with an image or composed media.
group: Components
status: stable
props:
  type: object
  required: [text_with_image__heading, text_with_image__text]
  properties:
    text_with_image__overline:
      type: [string, 'null']
      title: Overline
      description: Short label displayed above the heading.
      examples: ['Workshop series']
    text_with_image__heading:
      type: [string, object]
      title: Heading
      description: Text or rendered phrasing content for the section heading.
      examples: ['Learn to film an interview']
    text_with_image__heading_level:
      type: [integer, string, 'null']
      title: Heading level
      description: Semantic heading level within the page outline.
      enum: [2, 3, 4, 5, 6, '2', '3', '4', '5', '6', null]
      default: 2
    text_with_image__text:
      type: [string, object]
      title: Text
      description: Formatted text or a render array for the main copy.
      examples:
        - '<p>Practice framing an interview and recording clear audio in a hands-on workshop.</p>'
    text_with_image__ctas:
      type: [array, 'null']
      title: Calls to action
      description: Up to two links with labels and optional decorative icons.
      maxItems: 2
      default: []
      items:
        type: object
        required: [content, url]
        properties:
          content:
            type: string
            title: Label
            description: Descriptive link label.
          url:
            type: string
            title: Destination
            description: Destination for the action.
          icon:
            type: [string, 'null']
            title: Icon
            description: Optional decorative icon name.
          icon_position:
            type: [string, 'null']
            title: Icon position
            description: Position of the icon beside the label.
            enum: [left, right, null]
    text_with_image__media_alignment:
      type: [string, 'null']
      title: Media alignment
      description: Side of the media in the two-column layout.
      enum: [left, right, null]
      default: left
    text_with_image__focus:
      type: [string, 'null']
      title: Column emphasis
      description: Use equal columns or give the image or text a wider column.
      enum: [equal, image, text, null]
      default: equal
    text_with_image__image__src:
      type: [string, 'null']
      title: Image source
      description: Source of the image used when the media slot is empty.
      examples: ['assets/images/example/basic-camera-image.png']
    text_with_image__image__alt:
      type: [string, 'null']
      title: Alternative text
      description: Equivalent text for an informative image. Required to render an image unless it is explicitly decorative.
      examples: ['Video camera mounted on a tripod']
    text_with_image__image__decorative:
      type: [boolean, 'null']
      title: Decorative image
      description: Use empty alternative text for a purely decorative image.
      default: false
    text_with_image__image__srcset:
      type: [string, 'null']
      title: Responsive image sources
      description: Responsive image sources with width or density descriptors.
      default: null
    text_with_image__image__sizes:
      type: [string, 'null']
      title: Responsive image sizes
      description: Expected rendered widths for responsive image sources.
      default: null
    text_with_image__image__width:
      type: [integer, 'null']
      title: Image width
      description: Intrinsic width used to reserve space before the image loads.
      examples: [847]
    text_with_image__image__height:
      type: [integer, 'null']
      title: Image height
      description: Intrinsic height used to reserve space before the image loads.
      examples: [451]
    text_with_image__image__caption:
      type: [string, 'null']
      title: Image caption
      description: Optional caption below the image.
      default: null
    text_with_image__image__credit:
      type: [string, 'null']
      title: Image credit
      description: Optional visible attribution below the image.
      default: null
    text_with_image__width:
      type: [string, 'null']
      title: Container width
      description: Width of the section container.
      enum: [narrow, content, wide, full, null]
      default: content
    text_with_image__theme:
      type: [string, 'null']
      title: Theme
      description: Theme name. Leaving both theme props unset inherits the surrounding theme.
      default: null
    text_with_image__theme__variation:
      type: [string, 'null']
      title: Theme variation
      description: Color variation for the section theme.
      enum: [light, dark, null]
      default: null
    text_with_image__bg_color:
      type: [boolean, 'null']
      title: Background
      description: Paint the active theme background on the section container.
      default: false
    text_with_image__spacing:
      type: [string, 'null']
      title: Section spacing
      description: Vertical padding option from the shared container.
      default: one
      enum:
        - none
        - quarter
        - half
        - one
        - two
        - three
        - four
        - none-top
        - quarter-top
        - half-top
        - one-top
        - two-top
        - three-top
        - four-top
        - none-bottom
        - quarter-bottom
        - half-bottom
        - one-bottom
        - two-bottom
        - three-bottom
        - four-bottom
        - null
    text_with_image__id:
      type: [string, integer, 'null']
      title: Anchor suffix
      description: Stable page-unique suffix for the section anchor.
      default: null
    text_with_image__container__modifiers:
      type: [array, 'null']
      title: Container modifiers
      description: BEM modifiers applied to the shared container.
      items:
        type: string
    text_with_image__blockname:
      type: [string, 'null']
      title: Parent block
      description: Parent BEM block name for the component wrapper.
    text_with_image__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: BEM modifiers for the component wrapper.
      items:
        type: string
    text_with_image__additional_classes:
      type: [array, 'null']
      title: Additional classes
      description: Extra class names for the component wrapper.
      items:
        type: string
    text_with_image__attributes:
      type: [object, 'null']
      title: Attributes
      description: Additional HTML attributes for the component wrapper.
slots:
  text_with_image__media_content:
    title: Media content
    description: Replaces the default image with rendered media.
