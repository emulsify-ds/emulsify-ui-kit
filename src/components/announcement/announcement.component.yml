$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Announcement
description: A notice with a heading, short message, and optional actions.
group: Components
status: stable
libraryOverrides:
  dependencies: [core/drupal, core/once]
props:
  type: object
  properties:
    announcement__heading:
      type: string
      title: Heading
      description: The title of the announcement.
      examples: ['Library hours are changing']
    announcement__heading_level:
      type: [integer, 'null']
      title: Heading level
      description: The level in the surrounding document outline.
      enum: [2, 3, 4, 5, 6, null]
      default: 4
    announcement__content:
      type: string
      title: Content
      description: The plain text of the notice.
      examples: ['Starting Monday, the library will close at 6 p.m.']
    announcement__icon:
      type: [string, 'null']
      title: Icon
      description: An optional decorative icon from the icon library.
      examples: [circle-info]
    announcement__variant:
      type: [string, 'null']
      title: Variant
      description: The surface style in the active theme.
      enum: [default, tint, null]
      default: default
    announcement__ctas:
      type: [array, 'null']
      title: Actions
      description: Up to two calls to action in priority order.
      maxItems: 2
      items:
        type: object
        required: [content, url]
        properties:
          content:
            type: string
            title: Label
            description: Visible text for the action.
          url:
            type: string
            title: Destination
            description: The link URL for the action.
          icon:
            type: [string, 'null']
            title: Icon
            description: An optional decorative icon name.
          icon_position:
            type: [string, 'null']
            title: Icon position
            description: The side on which the icon appears.
            enum: [left, right, null]
      default: []
      examples:
        - - content: Check opening hours
            url: /library/hours
    announcement__dismissible:
      type: [boolean, 'null']
      title: Dismissible
      description: Offer a dismissal button when JavaScript is available.
      default: false
    announcement__blockname:
      type: [string, 'null']
      title: BEM block name
      description: Optional parent block name for the announcement.
    announcement__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: BEM modifiers on the announcement wrapper.
      items:
        type: string
    announcement__additional_classes:
      type: [array, 'null']
      title: Additional classes
      description: Extra CSS classes on the wrapper.
      items:
        type: string
    announcement__attributes:
      type: [object, 'null']
      title: Attributes
      description: Extra HTML attributes for the wrapper.
  required: [announcement__heading, announcement__content]
