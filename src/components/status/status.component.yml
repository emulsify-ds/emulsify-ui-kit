$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Status
description: Feedback messages with visible type labels and live-region roles.
group: Components
status: stable
libraryOverrides:
  dependencies: [core/drupal, core/once]
props:
  type: object
  properties:
    status__messages:
      type: [object, 'null']
      title: Messages
      description: Messages by type. Each group contains text or rendered Drupal content.
      default: {}
      additionalProperties:
        type: array
        items:
          type: [string, object, array]
      examples:
        - info: ['The library opens at 10 a.m. on Saturday.']
          success: ['Your workshop reservation is confirmed.']
          warning: ['Your reservation expires in five minutes.']
          error: ['The reservation could not be saved. Try again.']
    status__labels:
      type: [object, 'null']
      title: Labels
      description: Optional translated labels keyed by message type.
      default: {}
      additionalProperties:
        type: string
    status__dismissible:
      type: [boolean, 'null']
      title: Dismissible
      description: Show a separate dismiss button for each message group when JavaScript is active.
      default: false
    status__blockname:
      type: [string, 'null']
      title: Parent block
      description: Optional parent BEM block name.
    status__modifiers:
      type: [array, 'null']
      title: Modifiers
      description: BEM modifiers for the message wrapper.
      items:
        type: string
    status__additional_classes:
      type: [array, 'null']
      title: Classes
      description: Additional classes for the message wrapper.
      items:
        type: string
    status__attributes:
      type: [object, 'null']
      title: Attributes
      description: Attributes for the message wrapper.
